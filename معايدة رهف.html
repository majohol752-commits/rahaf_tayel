.heart{transform-box:fill-box;transform-origin:center;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.15)}}

.wand{transform-box:view-box;transform-origin:176px 254px}

.fly{position:fixed;pointer-events:none;z-index:9}
.splat{position:fixed;pointer-events:none;z-index:8;border-radius:48% 52% 55% 45%;background:radial-gradient(circle,#ffc933 0 26%,#fff 28% 60%,#fff0 72%);animation:drip 6s forwards}
